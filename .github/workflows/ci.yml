name: CI

# Every push and every pull request: the desktop compiles and its tests pass, against the core this
# commit pins. Packaging is not here -- it takes twenty minutes and half a gigabyte of Chromium per
# platform and belongs to a release, which Noctorium-Installer makes.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Tests and compilation
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      # The core is checked out by hand rather than as a submodule. A submodule fetch reaches for the
      # same credential as the repository holding it -- here, a job token that can see this repository
      # and nothing else -- so it cannot reach a private Noctorium-Base. NOCTORIUM_BASE_KEY is a
      # read-only deploy key on that repository, and it is read at exactly the commit the submodule
      # pins, so CI builds what a checkout of this commit would build.
      - name: Which core this commit is built against
        id: core
        run: echo "sha=$(git rev-parse HEAD:base)" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          repository: Noctorium/Noctorium-Base
          ref: ${{ steps.core.outputs.sha }}
          path: base
          ssh-key: ${{ secrets.NOCTORIUM_BASE_KEY }}

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Test and compile
        run: ./gradlew test compileKotlin --stacktrace
