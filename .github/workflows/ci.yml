name: CI

# Every push and every pull request: the desktop compiles and its tests pass, against the core this
# commit pins. Packaging is not here -- it takes twenty minutes and half a gigabyte of Chromium per
# platform and belongs to a release, which Noctorium-Installer makes.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Tests and compilation
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      # The core comes in as the base/ submodule, at the commit this one pins, so CI builds what a
      # checkout of this commit builds. It needs no credential: the job's own token reads a public
      # repository, which Noctorium-Base now is.
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Test and compile
        run: ./gradlew test compileKotlin --stacktrace
